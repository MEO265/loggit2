url: https://r-loggit.org/

home:
  title: Structured logging for R with minimal setup
  description: Add logging to existing R code in one call, capture messages, warnings and errors, or write structured NDJSON events with custom fields. No additional R runtime dependencies.
  sidebar:
    structure: [links, license, dev]

template:
  bootstrap: 5
  includes:
    in_header: <link rel="icon" type="image/svg+xml" href="https://filedn.eu/ldV4y5YKQXjQ0wNYvKjlJrp/favicon.svg">
  opengraph:
    image:
      src: https://filedn.eu/ldV4y5YKQXjQ0wNYvKjlJrp/opengraph_filled_2.png

reference:
  - title: Condition log handlers
  - contents:
    - "message"
    - "warning"
    - "stop"
    - "stopifnot"
  - title: Non-base log handlers
  - contents:
    - "debuginfo"
  - title: Log functions
  - contents:
    - "loggit"
    - "with_loggit"
    - "trace_loggit"
    - "watch_loggit"
  - title: Utility functions
  - contents:
    - "read_logs"
    - "rotate_logs"
    - "convert_to_csv"
  - title: Configuration
  - contents:
    - starts_with("set_")
    - starts_with("get_")

articles:
  - title: Start here
    navbar: ~
    contents:
      - loggit2
  - title: Follow your use case
    navbar: Use cases
    contents:
      - logging-existing-code
      - structured-logs
      - further_configurations
  - title: Background
    contents:
      - articles/fork

development:
  mode: auto

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: github

footer:
  structure:
    left: package
    right: developed_by
